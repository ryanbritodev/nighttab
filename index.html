<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Firefox Developer Edition</title>
    <link rel="icon" type="image/png" href="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Firefox_Developer_Edition_logo%2C_2017.svg/500px-Firefox_Developer_Edition_logo%2C_2017.svg.png">
    
    <!-- Google Fonts: Montserrat & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --accent: #036ae8;
            --accent-glow: rgba(3, 106, 232, 0.35);
            --card-bg: rgba(28, 32, 36, 0.88);
            --card-hover: rgba(41, 46, 52, 0.95);
            --text-main: #ffffff;
            --bg-image: url("https://i.redd.it/9vw6gbm691g21.png");
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* A cor de fundo fica só no html: se o body tiver fundo próprio, ele cobre
           as camadas .bg-layer e .bg-overlay (z-index negativo) e a imagem não aparece. */
        html {
            background-color: #04122c;
        }

        html, body {
            min-height: 100%;
            width: 100%;
            font-family: 'Manrope', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Background com fallback em gradiente idêntico ao wallpaper do Firefox Dev */
        .bg-layer {
            position: fixed;
            inset: 0;
            background-color: #04122c;
            background-image: 
                var(--bg-image),
                radial-gradient(circle at 50% 50%, #063875 0%, #031533 65%, #010814 100%);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Leve escurecimento no mobile para garantir leitura perfeita sobre o logo ao fundo */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 12, 24, 0.25);
            z-index: -1;
        }

        /* Container principal adaptado primeiro para celular (vertical) e expansível para telas maiores */
        .container {
            min-height: 100dvh;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2.2rem;
        }

        /* Cabeçalho: Saudação e Relógio */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .greeting {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: clamp(1.45rem, 5.5vw, 2.25rem);
            margin-bottom: 0.35rem;
            letter-spacing: -0.01em;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        }

        .clock {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: clamp(3.3rem, 15vw, 5.6rem);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.02em;
            text-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
            font-variant-numeric: tabular-nums;
        }

        .clock-sep {
            color: var(--accent);
            margin: 0 0.08em;
            transform: translateY(-0.04em);
        }

        /* Área de Favoritos / Grupos */
        .bookmarks-section {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .group-header {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            cursor: pointer;
            user-select: none;
            width: fit-content;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            transition: opacity 0.2s ease;
        }

        .group-header:active {
            opacity: 0.7;
        }

        .group-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .group-chevron {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .group.collapsed .group-chevron {
            transform: rotate(180deg);
        }

        .group.collapsed .group-grid {
            display: none;
        }

        /* Grade otimizada para toque no celular */
        .group-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
        }

        /* Card do Favorito */
        .bookmark-card {
            aspect-ratio: 1 / 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--accent);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                        background-color 0.18s ease,
                        box-shadow 0.18s ease,
                        border-color 0.18s ease;
            position: relative;
            overflow: hidden;
        }

        .bookmark-card i {
            font-size: 2.1rem;
            transition: transform 0.18s ease;
        }

        .bookmark-card svg.gemini-icon {
            width: 2.2rem;
            height: 2.2rem;
            fill: var(--accent);
            transition: transform 0.18s ease;
        }

        /* Nome sutil opcional caso o usuário ative os rótulos na barra inferior */
        .bookmark-label {
            display: none;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.78);
            margin-top: 0.45rem;
            text-align: center;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.show-labels .bookmark-label {
            display: block;
        }

        body.show-labels .bookmark-card i {
            font-size: 1.75rem;
        }

        body.show-labels .bookmark-card svg.gemini-icon {
            width: 1.85rem;
            height: 1.85rem;
        }

        .bookmark-card:hover,
        .bookmark-card:active {
            transform: scale(1.04);
            background: var(--card-hover);
            border-color: rgba(3, 106, 232, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55), 0 0 16px var(--accent-glow);
        }

        /* Barra inferior estilo nightTab */
        .toolbar-pill {
            position: fixed;
            bottom: 1.1rem;
            left: 1.1rem;
            background: rgba(23, 25, 28, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 0.35rem 0.65rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 20;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .toolbar-btn:hover,
        .toolbar-btn:active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Responsividade para telas muito estreitas */
        @media (max-width: 350px) {
            .group-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Responsividade para modo paisagem / tablets / desktop (igual ao print original) */
        @media (min-width: 820px) {
            .container {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 3rem 4rem;
                gap: 3.5rem;
            }

            .header-section {
                align-items: flex-start;
                text-align: left;
                width: auto;
                flex-shrink: 0;
            }

            .bookmarks-section {
                max-width: 640px;
                flex-grow: 1;
            }

            .group-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <main class="container">
        <!-- Saudação e Relógio -->
        <header class="header-section">
            <div class="greeting">Bem-vindo, Ryan! 😄</div>
            <div class="clock" id="clock">
                <span id="hours">12</span>
                <span class="clock-sep">:</span>
                <span id="minutes">24</span>
                <span class="clock-sep">:</span>
                <span id="seconds">43</span>
            </div>
        </header>

        <!-- Grupos de Links -->
        <section class="bookmarks-section">
            
            <!-- Grupo 1: Links úteis -->
            <div class="group" id="group-uteis">
                <div class="group-header" onclick="toggleGroup('group-uteis')">
                    <h2 class="group-title">Links úteis</h2>
                    <i class="fa-solid fa-chevron-up group-chevron"></i>
                </div>
                <div class="group-grid">
                    <a class="bookmark-card" href="https://m365.cloud.microsoft/?auth=2" title="Microsoft 365">
                        <i class="fa-brands fa-microsoft"></i>
                        <span class="bookmark-label">Microsoft 365</span>
                    </a>
                    <a class="bookmark-card" href="https://portfolio-ryanbrito.vercel.app/" title="Portfólio">
                        <i class="fa-solid fa-user"></i>
                        <span class="bookmark-label">Portfólio</span>
                    </a>
                    <a class="bookmark-card" href="https://mail.google.com/" title="Gmail">
                        <i class="fa-solid fa-envelope"></i>
                        <span class="bookmark-label">Gmail</span>
                    </a>
                    <a class="bookmark-card" href="https://github.com/ryanbritodev" title="GitHub">
                        <i class="fa-brands fa-github"></i>
                        <span class="bookmark-label">GitHub</span>
                    </a>
                    <a class="bookmark-card" href="https://on.fiap.com.br/" title="FIAP">
                        <i class="fa-solid fa-building-columns"></i>
                        <span class="bookmark-label">FIAP</span>
                    </a>
                </div>
            </div>

            <!-- Grupo 2: Miscelânea -->
            <div class="group" id="group-misc">
                <div class="group-header" onclick="toggleGroup('group-misc')">
                    <h2 class="group-title">Miscelânea</h2>
                    <i class="fa-solid fa-chevron-up group-chevron"></i>
                </div>
                <div class="group-grid">
                    <a class="bookmark-card" href="https://instagram.com/" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                        <span class="bookmark-label">Instagram</span>
                    </a>
                    <a class="bookmark-card" href="https://web.whatsapp.com/" title="WhatsApp">
                        <i class="fa-brands fa-whatsapp"></i>
                        <span class="bookmark-label">WhatsApp</span>
                    </a>
                    <a class="bookmark-card" href="https://www.youtube.com/" title="YouTube">
                        <i class="fa-brands fa-youtube"></i>
                        <span class="bookmark-label">YouTube</span>
                    </a>
                    <a class="bookmark-card" href="https://www.linkedin.com/in/ryanbritodev/" title="LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                        <span class="bookmark-label">LinkedIn</span>
                    </a>
                    <a class="bookmark-card" href="https://gemini.google.com/app?hl=pt-BR" title="Gemini">
                        <!-- Ícone da estrela de 4 pontas do Gemini em SVG embutido -->
                        <svg class="gemini-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C12 7.52285 16.4772 12 22 12C16.4772 12 12 16.4772 12 22C12 16.4772 7.52285 12 2 12C7.52285 12 12 7.52285 12 2Z"/>
                        </svg>
                        <span class="bookmark-label">Gemini</span>
                    </a>
                </div>
            </div>

        </section>
    </main>

    <!-- Barra de controle inferior (Permite alternar nomes dos ícones ou mudar de 3 para 5 colunas no celular) -->
    <div class="toolbar-pill">
        <button class="toolbar-btn" onclick="toggleLabels()" title="Mostrar/ocultar nomes dos atalhos">
            <i class="fa-solid fa-tag"></i>
        </button>
        <button class="toolbar-btn" onclick="toggleColumns()" title="Alternar número de colunas no celular">
            <i class="fa-solid fa-grip"></i>
        </button>
    </div>

    <script>
        // Relógio em tempo real
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = h;
            document.getElementById('minutes').textContent = m;
            document.getElementById('seconds').textContent = s;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Recolher/Expandir grupos (salva o estado no celular)
        function toggleGroup(groupId) {
            const el = document.getElementById(groupId);
            if (!el) return;
            el.classList.toggle('collapsed');
        }

        // Alternar exibição dos nomes abaixo dos ícones
        function toggleLabels() {
            document.body.classList.toggle('show-labels');
            localStorage.setItem('nighttab_show_labels', document.body.classList.contains('show-labels'));
        }

        // Alternar entre 3 colunas (padrão confortável para o polegar) ou 5 colunas no modo retrato
        let compactColumns = false;
        function toggleColumns() {
            compactColumns = !compactColumns;
            const grids = document.querySelectorAll('.group-grid');
            grids.forEach(grid => {
                if (window.innerWidth < 820) {
                    grid.style.gridTemplateColumns = compactColumns ? 'repeat(5, 1fr)' : '';
                }
            });
            localStorage.setItem('nighttab_compact_cols', compactColumns);
        }

        // Restaurar preferências salvas
        (function restorePrefs() {
            if (localStorage.getItem('nighttab_show_labels') === 'true') {
                document.body.classList.add('show-labels');
            }
            if (localStorage.getItem('nighttab_compact_cols') === 'true') {
                toggleColumns();
            }
        })();
    </script>
</body>
</html>
